// These parts have equivalents in Restock, so lets use the Restock parts instead.
// This is a soft-replacement, existing craft will be unaffected, but you won't find these in the editor or in R&D.
// If Restock/RestockPlus is ever uninstalled, then these parts will appear again.

// Replaced by Heat Shield (1.875m) and Heat Shield (2.5m)
@PART[WBI_MK2-5HeatShield,WBI_MK85HeatShield]:NEEDS[Restock]
{
	TechHidden = true
	@category = none
	@TechRequired = start
	@tags =
}

