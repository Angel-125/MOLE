// At the time of this writing, the core station parts- MOLE, MOH, MOBL- are over a decade old!
// Their 3D meshes need a lot of help. Fortunately, Buffalo 2 has come to the rescue.
// With Buffalo 2 installed, the original parts are soft-deprecated in favor of their Buffalo 2 equivalents.

// Replaced by B2 Docking Port
@PART[wbiMk2DockingPort]:NEEDS[Buffalo2]
{
	@TechRequired = start
	@category = none
	%TechHidden = True
	%tags = none
}

// Replaced by Buffalo Command Pod
@PART[wbiMk1Cupola2]:NEEDS[Buffalo2]
{
	@TechRequired = start
	@category = none
	%TechHidden = True
	%tags = none
}

@PART[wbiMOLEV2]:NEEDS[Buffalo2]
{
	!MODEL {}
	MODEL
	{
		model = WildBlueIndustries/Buffalo2/Parts/sharedAssets/moleLabV2
	}

	!INTERNAL {}
	INTERNAL
	{
		name = wbiLabModuleIVA
	}

	!MODULE[WBIPropStateHelper] {}
	!MODULE[ModulePartVariants] {}

	MODULE
	{
		name = WBIModuleSeatRotator
		seatName = Seat001
		propRotationAxis = -1,0,0
	}
	MODULE
	{
		name = WBIModuleSeatRotator
		seatName = Seat002
		propRotationAxis = -1,0,0
	}

	// Permanent Station Variant
	MODULE
	{
		name = WBIModuleIVAVariants
		selectedVariant = Station

		VARIANT
		{
			name = Station

			GAMEOBJECTS
			{
				roverCeiling = false
				roverCeilingSolid = false
				stationCeiling = true
				roverMask = false
				roverMaskSolid = false
				stationMask = true
				superstructureMask = false
				superstructureMaskSolid = false
			}
		}
	}
}

