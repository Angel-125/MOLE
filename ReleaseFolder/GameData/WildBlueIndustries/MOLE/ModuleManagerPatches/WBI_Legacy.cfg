// WBIExperimentLab produces and distributes LabTime. Keep a small persistent
// buffer on every lab, including deprecated and stock-patched parts. The lab
// expands resource capacity at runtime when experiments are loaded.
@PART[*]:HAS[@MODULE[WBIExperimentLab],!RESOURCE[LabTime]]:AFTER[MOLE]:NEEDS[WBIScience]
{
	RESOURCE
	{
		name = LabTime
		amount = 0
		maxAmount = 36
		isTweakable = false
	}
}
