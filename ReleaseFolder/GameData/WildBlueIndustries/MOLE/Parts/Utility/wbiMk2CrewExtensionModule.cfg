PART
{
	// --- general parameters ---
	name = wbiMk2CrewExtensionModule
	module = Part
	author = Angel-125

	// --- asset parameters ---
	MODEL
	{
		model = WildBlueIndustries/MOLE/Assets/mk2CrewExtensionModule
	}
	rescaleFactor = 1

	// --- node definitions ---
	// definition format is Position X, Position Y, Position Z, Up X, Up Y, Up Z
	node_stack_top = 0.0, 0.375, 0.0, 0.0, 1.0, 0.0, 1
	node_stack_bottom = 0.0, -0.375, 0.0, 0.0, -1.0, 0.0, 2

	// --- editor parameters ---
	TechRequired:NEEDS[!UnKerballedStart] = spaceExploration
	TechRequired:NEEDS[UnKerballedStart] = commandModules
	entryCost = 12400
	cost = 4000
	category = Utility
	subcategory = 0
	title = Mk2 Crew Extension Module
	manufacturer = #autoLOC_501632 //#autoLOC_501632 = Sean's Cannery
	description = Affectionately called the Big Mark (pilots call it the Burger), this extension module is a "Backseat" for the Mk2 Command Pod that crams 5 kerbals into an uncomfortably tight space.

	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 1,0,1,1,0

	// --- standard part parameters ---
	mass = 1.875
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.15
	angularDrag = 2
	crashTolerance = 14
	breakingForce = 20000
	breakingTorque = 20000
	maxTemp = 1300
	skinMaxTemp = 2300
	thermalMassModifier = 8.0
//	CoMOffset = 0,-.6,0
//	CoPOffset = 0.0, -0.4, 0.0 //drag force offset, should be ahead of center of mass
	CenterOfBuoyancy = 0.0, 0.5, 0.0
	CenterOfDisplacement = 0.0, -1.7, 0.0
	buoyancyUseSine = False
	buoyancy = 1 // 1.3
	bulkheadProfiles = size1p5, size2
	vesselType = Ship
	tags = cck-MOLE

	// --- internal setup ---
	CrewCapacity = 5

	INTERNAL
	{
		name = wbiMk2CrewExtensionModuleIVA
	}

	MODULE
	{
		name = ModuleColorChanger
		shaderProperty = _EmissiveColor
		animRate = 0.8
		animState = false
		useRate = true
		toggleInEditor = true
		toggleInFlight = true
		toggleInFlight = true
		unfocusedRange = 5
		toggleName = #autoLOC_502011 //#autoLOC_502011 = Toggle Lights
		eventOnName = #autoLOC_502012 //#autoLOC_502012 = Lights On
		eventOffName = #autoLOC_502013 //#autoLOC_502013 = Lights Off
		toggleAction = True
		defaultActionGroup = Light
		useMaterialsList = true
		materialsNames = mk2BigbyV2
		redCurve
		{
			key = 0 0 0 3
			key = 1 1 0 0
		}
		greenCurve
		{
			key = 0 0 0 1
			key = 1 1 1 0
		}
		blueCurve
		{
			key = 0 0 0 0
			key = 1 0.7 1.5 0
		}
		alphaCurve
		{
			key = 0 1
		}
	}

	MODULE
	{
		name = ModuleScienceExperiment	
	
		experimentID = crewReport
	
		experimentActionName = Crew Report
		resetActionName = Discard Crew Report
		reviewActionName = Review Report
	
		useStaging = False	
		useActionGroups = True
		hideUIwhenUnavailable = True	
		rerunnable = True
	
		xmitDataScalar = 1.0
	}

	MODULE
	{
		name = ModuleScienceContainer
	
		reviewActionName = Review Stored Data
		storeActionName = Store Experiments
		evaOnlyStorage = True
		storageRange = 1.3
	}

	MODULE
	{
        	name = ModuleInventoryPart
	        InventorySlots = 6
        	packedVolumeLimit = 1000
	}

	MODULE
	{
		name = WBIPropStateHelper
	}

	MODULE
	{
		name = ModuleConductionMultiplier
		modifiedConductionFactor = 0.003
		convectionFluxThreshold = 3000
	}
}