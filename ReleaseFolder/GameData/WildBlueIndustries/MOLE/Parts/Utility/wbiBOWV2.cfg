PART
{
	name = wbiBOWV2
	module = Part
	author = Angel-125

	// --- asset parameters ---
	rescaleFactor = 1

	MODEL
	{
		model = WildBlueIndustries/MOLE/Assets/bigbyOrbitalWorkshopV2
	}
	MODEL
	{
		model = WildBlueIndustries/MOLE/Parts/Command/Appaloosa/bigbyCrewHatches
	}

	node_stack_top = 0.0, 2.812, 0.0, 0.0, 1.0, 0.0, 2
	node_stack_bottom = 0.0, -2.812, 0.0, 0.0, -1.0, 0.0, 2
	node_attach = 0.0, 0.0, -1.89, 0.0, 0.0, 1.0

	// --- editor parameters ---
	TechRequired = specializedConstruction
	entryCost = 24000
	cost = 12000
	category = Utility
	subcategory = 0
	title = Bigby Orbital Workshop
	manufacturer = Wild Blue Industries
	description = Subcontracted to Bigby Tools, the Bigby Orbital Workshop offers a wide variety of different configurations to choose from, ranging from industrial production to scientific research and even asteroid processing. Is there nothing the Orbital Workshop can't do?

	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 1,1,1,1,0

	// --- standard part parameters ---
	mass = 8
	dragModelType = default
	maximum_drag = 0.25
	minimum_drag = 0.25
	angularDrag = .5
	crashTolerance = 45
	breakingForce = 5000
	breakingTorque = 5000
	maxTemp = 1000
	skinMaxTemp = 2000
	emissiveConstant = 0.5
	CrewCapacity = 6
	vesselType = Station
	buoyancy = 0
	tags = cck-MOLE

	INTERNAL
	{
		name = WBI_BOWSpace
	}

	MODULE
	{
		name = ModuleScienceContainer
		reviewActionName = Review Data
		storeActionName = Store Experiments
		collectActionName = Take Data
		evaOnlyStorage = True
		storageRange = 2
		allowRepeatedSubjects = True
	}

	MODULE
	{
		name = ModuleScienceLab
		containerModuleIndex = 0
		dataStorage = 1000
		crewsRequired = 3
		canResetConnectedModules = True
		canResetNearbyModules = True
		interactionRange = 5
		SurfaceBonus = 0.1
		ContextBonus = 0.25
		homeworldMultiplier = 0.2

		RESOURCE_PROCESS
		{
			name = ElectricCharge
			amount = 10
		}
	}

	MODULE
	{
		name = ModuleScienceConverter
		scientistBonus = 0.1	//Bonus per scientist star - need at least one! So 0.25x - 2.5x 
		researchTime = 7	//Larger = slower.  Exponential!
		scienceMultiplier = 5	//How much science does data turn into?
		scienceCap = 800	//How much science can we store before having to transmit?		
		powerRequirement = 5	//EC/Sec to research
		ConverterName = Data Processing
		StartActionName = Start Data Processing
		StopActionName = Stop Data Processing
	}

	MODULE
	{
		name = ModuleColorChanger
		shaderProperty = _EmissiveColor
		animRate = 0.8
		animState = false
		useRate = true
		toggleInEditor = true
		toggleInFlight = true
		toggleInFlight = true
		unfocusedRange = 5
		toggleName = #autoLOC_502011 //#autoLOC_502011 = Toggle Lights
		eventOnName = #autoLOC_502012 //#autoLOC_502012 = Lights On
		eventOffName = #autoLOC_502013 //#autoLOC_502013 = Lights Off
		toggleAction = True
		defaultActionGroup = Light
		useMaterialsList = true
		materialsNames = Window
		redCurve
		{
			key = 0 0 0 3
			key = 1 1 0 0
		}
		greenCurve
		{
			key = 0 0 0 1
			key = 1 1 1 0
		}
		blueCurve
		{
			key = 0 0 0 0
			key = 1 0.7 1.5 0
		}
		alphaCurve
		{
			key = 0 1
		}
	}

	MODULE
	{
        	name = ModuleInventoryPart
	        InventorySlots = 12
        	packedVolumeLimit = 2000
	}

	MODULE
	{
		name = ModuleResourceConverter
		ConverterName = MPU
		StartActionName = Start MPU
		StopActionName = Stop MPU
		FillAmount = 0.99		 
		AutoShutdown = true
		GeneratesHeat = false
		TemperatureModifier = 60
		UseSpecializationBonus = true
		SpecialistEfficiencyFactor = 0.1
		ExperienceEffect = ConverterSkill
		EfficiencyBonus = 1.0
		 
		INPUT_RESOURCE
		{
			ResourceName = MonoPropellant
			Ratio = 0.0125
			FlowMode = ALL_VESSEL
		}

		OUTPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 5
			DumpExcess = false
		}
	}

	MODULE
	{
		name = FlagDecal
		textureQuadName = flagTransform
	}

	MODULE
	{
		name = WBIWetWorkshop
		managedObjects = EVAElements
		convertToTankName = Convert to tank (EDITOR ONLY)
		convertToWorkshopName = Convert to workshop
		crewCapacity = 6
		allowTankConversionInFlight = false
		isDeployed = true

		// Input resources required to deploy the part.
		INPUT_RESOURCE
		{
			name = Equipment
			amount = 1200
			FlowMode = STAGE_PRIORITY_FLOW
		}	

		// Enabled when the part is deployed, disabled when not deployed.
		MANAGED_MODULES
		{
			moduleName = ModuleCommand
			moduleName = ModuleDataTransmitter
			moduleName = WBIModuleLight
			moduleName = WBIEfficiencyMonitor
			moduleName = ModuleKISInventory
			moduleName = WBIPropStateHelper
			moduleName = WBIOmniConverter
			moduleName = WBIOmniStorage
			moduleName = ModuleInventoryPart
			moduleName = SoilRecycler
			moduleName = SnacksConverter
			moduleName = ModuleColorChanger
			moduleName = WBIExperimentLab
			moduleName = WBIModuleScienceExperiment
			moduleName = ModuleResourceConverter
			moduleName = ModuleScienceConverter
			moduleName = ModuleScienceLab
			moduleName = ModuleScienceContainer
			moduleName = WBIModuleFuelPump
		}

		// These resources are added when the part is deployed and removed when it's undeployed.
		// Other resources will be removed.		
		MANAGED_RESOURCE
		{
			name = ElectricCharge
			maxAmount = 1200
		}
		MANAGED_RESOURCE:NEEDS[SnacksUtils]
		{
			name = Snacks
			maxAmount = 36
		}
		MANAGED_RESOURCE:NEEDS[SnacksUtils]
		{
			name = Soil
			maxAmount = 36
		}
		MANAGED_RESOURCE:NEEDS[SnacksFreshAir]
		{
			name = StaleAir
			maxAmount = 12
		}
		MANAGED_RESOURCE:NEEDS[SnacksFreshAir]
		{
			name = FreshAir
			maxAmount = 12
		}	
		MANAGED_RESOURCE
		{
			name = LiquidFuel
			maxAmount = 4860
			isTankResource = true
		}
		MANAGED_RESOURCE
		{
			name = Oxidizer
			maxAmount = 5940
			isTankResource = true
		}
	}

	RESOURCE
	{
		name = ElectricCharge
		amount = 1200
		maxAmount = 1200
	}
