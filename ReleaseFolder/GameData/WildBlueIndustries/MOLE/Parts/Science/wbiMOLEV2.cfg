PART
{
	name = wbiMOLEV2
	module = Part
	author = Angel-125

	MODEL
	{
		model = WildBlueIndustries/MOLE/Assets/MOLE18V2
	}
	rescaleFactor = 1

	node_attach = 0, 0, -0.66292, 0, 0, -1, 1
	node_stack_top = 0, 0.9375, 0, 0, 1, 0, 2
	node_stack_bottom = 0, -0.9375, 0, 0, -1, 0, 2

	TechRequired = spaceExploration
	entryCost = 12000
	cost = 7000
	category = Science
	subcategory = 0
	title = #LOC_MOLE_labTitle // M.O.L.E.
	manufacturer = Wild Blue Industries
	description = #LOC_MOLE_labDesc // In trying to reduce their inventory of defective fuel tanks, Wild Blue Industries built the Mark One Laboratory Extension (MOLE) out of a FL-TX1800 originally slated for scrap. With at least one crewmember aboard, this lab can conduct experiments using research kits to produce science. Or it can be configured to process experimental data for additional science, and clean experiments for reuse. It's mostly leakproof. Mostly.

	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 1,1,1,1,1

	// --- standard part parameters ---
	mass = 1.375
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 2
	crashTolerance = 20
	maxTemp = 1000
	maxSkinTemp = 2000
	breakingForce = 50000
	breakingTorque = 50000
	bulkheadProfiles = size1p5, srf
	CrewCapacity = 2
	tags = cck-MOLE base cabin (can outpost passenger statio tour tuna

	INTERNAL
	{
		name = WBI_MoleSpace
	}

	MODULE
	{
		name = ModuleScienceContainer
		reviewActionName = Review Data
		storeActionName = Store Experiments
		collectActionName = Take Data
		evaOnlyStorage = True
		storageRange = 2
		allowRepeatedSubjects = True
	}

	MODULE
	{
		name = ModuleScienceLab
		containerModuleIndex = 0
		dataStorage = 300
		crewsRequired = 1
		canResetConnectedModules = True
		canResetNearbyModules = True
		interactionRange = 5
		SurfaceBonus = 0
		ContextBonus = 0.05
		homeworldMultiplier = 0.1

		RESOURCE_PROCESS
		{
			name = ElectricCharge
			amount = 10
		}
	}

	MODULE
	{
		name = ModuleScienceConverter
		scientistBonus = 0.1	//Bonus per scientist star - need at least one! So 0.25x - 2.5x 
		researchTime = 7	//Larger = slower.  Exponential!
		scienceMultiplier = 5	//How much science does data turn into?
		scienceCap = 300	//How much science can we store before having to transmit?		
		powerRequirement = 5	//EC/Sec to research
		ConverterName = Data Processing
		StartActionName = Start Data Processing
		StopActionName = Stop Data Processing
	}

	MODULE
	{
        	name = ModuleExperienceManagement
        	costPerKerbal = 0
	}

	MODULE
	{
		name = ModuleInventoryPart		
		InventorySlots = 3
		packedVolumeLimit = 150
	}

	MODULE
	{
		name = ModuleColorChanger
		shaderProperty = _EmissiveColor
		animRate = 0.8
		animState = false
		useRate = true
		toggleInEditor = true
		toggleInFlight = true
		toggleInFlight = true
		unfocusedRange = 5
		toggleName = #autoLOC_502011 //#autoLOC_502011 = Toggle Lights
		eventOnName = #autoLOC_502012 //#autoLOC_502012 = Lights On
		eventOffName = #autoLOC_502013 //#autoLOC_502013 = Lights Off
		toggleAction = True
		defaultActionGroup = Light
		redCurve
		{
			key = 0 0 0 3
			key = 1 1 0 0
		}
		greenCurve
		{
			key = 0 0 0 1
			key = 1 1 1 0
		}
		blueCurve
		{
			key = 0 0 0 0
			key = 1 0.7 1.5 0
		}
		alphaCurve
		{
			key = 0 1
		}
	}

	MODULE
	{
		name = WBIWetWorkshop
		fuelTankMesh = fuelTankMesh
		workshopMesh = labModuleMesh
		managedObjects = evaElements	
		convertToTankName = Convert to tank (EDITOR ONLY)
		convertToWorkshopName = Convert to workshop
		crewCapacity = 2
		allowTankConversionInFlight = false
		isDeployed = true

		// Input resources required to deploy the part.
		INPUT_RESOURCE
		{
			name = Equipment
			amount = 200
			FlowMode = STAGE_PRIORITY_FLOW
		}	

		// Enabled when the part is deployed, disabled when not deployed.
		MANAGED_MODULES
		{
			moduleName = ModuleCommand
			moduleName = ModuleDataTransmitter
			moduleName = MOLEModuleLight
			moduleName = WBIEfficiencyMonitor
			moduleName = ModuleKISInventory
			moduleName = WBIPropStateHelper
			moduleName = WBIOmniConverter
			moduleName = WBIOmniStorage
			moduleName = ModuleInventoryPart
			moduleName = SoilRecycler
			moduleName = SnacksConverter
			moduleName = ModuleColorChanger
			moduleName = WBIExperimentLab
			moduleName = WBIModuleScienceExperiment
			moduleName = ModuleResourceConverter
			moduleName = ModuleScienceConverter
			moduleName = ModuleScienceLab
			moduleName = ModuleScienceContainer
			moduleName = WBIModuleFuelPump
			moduleName = WBIModuleSeatRotator
		}

		// These resources are added when the part is deployed and removed when it's undeployed.
		// Other resources will be removed.		
		MANAGED_RESOURCE
		{
			name = ElectricCharge
			maxAmount = 200
		}
		MANAGED_RESOURCE:NEEDS[SnacksUtils]
		{
			name = Snacks
			maxAmount = 12
		}
		MANAGED_RESOURCE:NEEDS[SnacksUtils]
		{
			name = Soil
			maxAmount = 12
		}
		MANAGED_RESOURCE:NEEDS[SnacksFreshAir]
		{
			name = StaleAir
			maxAmount = 4
		}
		MANAGED_RESOURCE:NEEDS[SnacksFreshAir]
		{
			name = FreshAir
			maxAmount = 4
		}
		MANAGED_RESOURCE
		{
			name = LiquidFuel
			maxAmount = 405
			isTankResource = true
		}
		MANAGED_RESOURCE
		{
			name = Oxidizer
			maxAmount = 495
			isTankResource = true
		}
	}

	MODULE
	{
		name = WBIPropStateHelper
	}

	MODULE
	{
		name = ModulePartVariants
		baseVariant = BlackAndWhite
		useMultipleDragCubes = false

		VARIANT
		{
			name = BlackAndWhite
			displayName = Theme: Black and white
			primaryColor = #ffffff
			secondaryColor = #222222
			TEXTURE
			{
				materialName = MOLE
				_MainTex = WildBlueIndustries/MOLE/Assets/MOLE
				_BumpMap = WildBlueIndustries/MOLE/Assets/MOLENrm
			}
		}

		VARIANT
		{
			name = MOLEWhite
			displayName = Theme: MOLE White
			primaryColor = #ffffff
			secondaryColor = #999999
			TEXTURE
			{
				materialName = MOLE
				_MainTex = WildBlueIndustries/MOLE/Assets/MOLEWhite
				_BumpMap = WildBlueIndustries/MOLE/Assets/MOLEWhiteNrm
			}
		}
	}

	RESOURCE
	{
		name = ElectricCharge
		amount = 200
		maxAmount = 200
	}
}
