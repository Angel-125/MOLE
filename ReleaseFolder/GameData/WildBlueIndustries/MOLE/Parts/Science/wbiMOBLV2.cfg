	attachRules = 1,1,1,1,1

	// --- standard part parameters ---
	mass = 1.375
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 2
	crashTolerance = 20
	maxTemp = 1000
	maxSkinTemp = 2000
	breakingForce = 50000
	breakingTorque = 50000
	bulkheadProfiles = size1p5, srf
	CrewCapacity = 2
	tags = cck-MOLE base cabin (can outpost passenger statio tour tuna

	INTERNAL
	{
		name = WBI_MOBLSpace
	}

	MODULE
	{
		name = ModuleInventoryPart		
		InventorySlots = 3
		packedVolumeLimit = 150
	}	

	MODULE
	{
		name = ModuleColorChanger
		shaderProperty = _EmissiveColor
