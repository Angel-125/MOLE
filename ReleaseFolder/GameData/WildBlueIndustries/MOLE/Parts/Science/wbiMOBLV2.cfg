PART
{
	name = wbiMOBLV2
	module = Part
	author = Angel-125

	MODEL
	{
		model = WildBlueIndustries/MOLE/Assets/MOBLV2
	}
	rescaleFactor = 1

	node_attach = 0, 0, -0.66292, 0, 0, -1, 1
	node_stack_top = 0, 0.9375, 0, 0, 1, 0, 2
	node_stack_bottom = 0, -0.9375, 0, 0, -1, 0, 2

	TechRequired = spaceExploration
	entryCost = 12000
