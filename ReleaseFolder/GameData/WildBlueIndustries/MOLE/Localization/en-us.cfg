Localization
{
	en-us
	{
		// WBIWetWorkshop
		#LOC_MOLE_shopTitle = Wet Workshop
		#LOC_MOLE_shopDesc = Converts from tank to Workshop
		#LOC_MOLE_shopRequires = Requirements
		#LOC_MOLE_missingResource = Needs <<1>> of <<2>> to <<3>>
		#LOC_MOLE_missingSkill = Needs <<1>> to <<2>>
		#LOC_MOLE_resourceInfo = <color=white><b><<1>>:</b> <<2>></color>

		// M.O.L.E.
		#LOC_MOLE_labTitle = M.O.L.E.
		#LOC_MOLE_labDesc = In trying to reduce their inventory of defective fuel tanks, Wild Blue Industries built the Mark One Laboratory Extension (MOLE) out of a FL-TX1800 originally slated for scrap. With at least one crewmember aboard, this lab can conduct experiments using research kits to produce science. Or it can be configured to process experimental data for additional science, and clean experiments for reuse. It's mostly leakproof. Mostly.

		// Mark One Botany Lab
		#LOC_MOLE_botanyLabTitle = Mark One Botany Lab
		#LOC_MOLE_botanyLabDesc = The Botany Lab is a fuel tank converted into an orbiting experimental garden to study plant growth in space. The designers originally wanted to call it the Botany Bay, but crews expressed concerns about the bay secretly holding cryopods full of genetically engineered, highly intelligent, BadS super kerbals capable of simultaneously being pilots, engineers, and scientists that would take over the space station. After numerous failed attempts to show that no secret cryopods existed, engineers relented and renamed the converted tank to the Botany Lab.

		// Mark One Habitat
		#LOC_MOLE_habTitle = Mark One Habitat
		#LOC_MOLE_habDesc = Created by Dolores "I am NOT sleeping in a cramped cockpit!" Kerman, the Dolores Mark One Habitat, created as part of Project Dolores, provides relatively spacious accommodations for up to two kerbals.
	}
}